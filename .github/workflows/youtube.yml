name: Latest YouTube videos

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: YOUTUBE
          feed_list: "https://www.youtube.com/feeds/videos.xml?playlist_id=UULFPe7wOkeAnoxZn9Ri8k05jw"
          max_post_count: 6
          commit_message: "Update latest YouTube videos"
