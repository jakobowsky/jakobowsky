<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Jakob Wolitzki - Amazon data and AI agents. Co-founder of DataDoe and Deltologic.">
<title>Jakob Wolitzki - Amazon data and AI agents</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9900"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff9900" stop-opacity="0.22"/><stop offset="1" stop-color="#ff9900" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1f2937" stroke-width="1"/></pattern>
  <clipPath id="r"><rect width="1280" height="360" rx="16"/></clipPath>
</defs>
<style>
  .h{font:800 66px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f9fafb;letter-spacing:-1px}
  .s{font:700 32px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#ac)}
  .b{font:400 22px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9ca3af}
  .chip{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9ca3af}
  .t{font:500 16px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#e6edf3}
  .p{fill:#e6edf3} .d{fill:#7d8590} .o{fill:#3fb950}
  .cur{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .glow{animation:pulse 6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
  @keyframes l0{0%,3.3%{opacity:0;transform:translateX(-6px)}5.3%,94%{opacity:1;transform:translateX(0)}100%{opacity:0}}.l0{opacity:0;animation:l0 12s ease-out infinite}@keyframes l1{0%,20.0%{opacity:0;transform:translateX(-6px)}22.0%,94%{opacity:1;transform:translateX(0)}100%{opacity:0}}.l1{opacity:0;animation:l1 12s ease-out infinite}@keyframes l2{0%,28.3%{opacity:0;transform:translateX(-6px)}30.3%,94%{opacity:1;transform:translateX(0)}100%{opacity:0}}.l2{opacity:0;animation:l2 12s ease-out infinite}@keyframes l3{0%,38.3%{opacity:0;transform:translateX(-6px)}40.3%,94%{opacity:1;transform:translateX(0)}100%{opacity:0}}.l3{opacity:0;animation:l3 12s ease-out infinite}@keyframes l4{0%,51.7%{opacity:0;transform:translateX(-6px)}53.7%,94%{opacity:1;transform:translateX(0)}100%{opacity:0}}.l4{opacity:0;animation:l4 12s ease-out infinite}@keyframes l5{0%,68.3%{opacity:0;transform:translateX(-6px)}70.3%,94%{opacity:1;transform:translateX(0)}100%{opacity:0}}.l5{opacity:0;animation:l5 12s ease-out infinite}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
</style>
<g clip-path="url(#r)">
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.55"/>
  <ellipse class="glow" cx="960" cy="180" rx="420" ry="220" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#ac)"/>

  <text class="h" x="62" y="124">Jakob Wolitzki</text>
  <text class="s" x="66" y="174">Amazon data + AI agents</text>
  <text class="b" x="66" y="222">Co-founder of DataDoe and Deltologic.</text>
  <text class="b" x="66" y="254">Building on the Amazon SP-API since 2020.</text>
  <g transform="translate(64,286)"><rect width="144" height="34" rx="17" fill="#161b22" stroke="#1f2937"/><text x="72" y="22" class="chip" text-anchor="middle">Amazon SP-API</text></g><g transform="translate(218,286)"><rect width="153" height="34" rx="17" fill="#161b22" stroke="#1f2937"/><text x="76" y="22" class="chip" text-anchor="middle">Amazon Ads API</text></g><g transform="translate(380,286)"><rect width="52" height="34" rx="17" fill="#161b22" stroke="#1f2937"/><text x="26" y="22" class="chip" text-anchor="middle">MCP</text></g><g transform="translate(442,286)"><rect width="79" height="34" rx="17" fill="#161b22" stroke="#1f2937"/><text x="40" y="22" class="chip" text-anchor="middle">Claude</text></g><g transform="translate(531,286)"><rect width="107" height="34" rx="17" fill="#161b22" stroke="#1f2937"/><text x="53" y="22" class="chip" text-anchor="middle">AI agents</text></g>

  <g>
    <rect x="684" y="36" width="560" height="294" rx="12" fill="#0d1117" stroke="#30363d"/>
    <circle cx="708" cy="60" r="6" fill="#ff5f57"/><circle cx="728" cy="60" r="6" fill="#febc2e"/><circle cx="748" cy="60" r="6" fill="#28c840"/>
    <text x="964" y="65" class="t d" text-anchor="middle">claude + datadoe-mcp</text>
    <line x1="684" y1="82" x2="1244" y2="82" stroke="#30363d"/>
    <text class="t p l0" x="708" y="128">$ claude &quot;top 10 ASINs by revenue, all markets&quot;</text><text class="t d l1" x="708" y="159">  ● datadoe · sales_and_traffic · US UK DE</text><text class="t d l2" x="708" y="190">  ● datadoe · amazon_ads · sponsored_products</text><text class="t o l3" x="708" y="221">  ✓ 10 ASINs ranked · 3 above ACoS target</text><text class="t p l4" x="708" y="252">$ claude &quot;pause keywords that burn budget&quot;</text><text class="t o l5" x="708" y="283">  ✓ dryRun ok · 14 keywords · approve?</text>
    <rect class="cur" x="708" y="299" width="9" height="19" fill="#ff9900"/>
  </g>
</g>
